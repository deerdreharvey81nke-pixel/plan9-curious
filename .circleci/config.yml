    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - run:
          name: Produce fixture C
          command: |
            mkdir -p /tmp/store-C
            set +o pipefail 2>/dev/null; while IFS= read -r l; do echo "[${l}]"; done < <(seq 1 10000) > /tmp/store-C/ZINC_NEUTRON_LOADER_FILTER; true
            echo "produced $(wc -l </tmp/store-C/ZINC_NEUTRON_LOADER_FILTER) lines"
      - persist_to_workspace:
          root: /tmp/store-C
          paths:
            - 'ZINC_NEUTRON_LOADER_FILTER'
  Run_Tests6:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - attach_workspace:
          at: /tmp/store-C
      - run:
          name: Attach upstream
          command: |
            cat /tmp/store-C/ZINC_NEUTRON_LOADER_FILTER 2>/dev/null | tee /dev/null | md5sum | cut -c1-8 || true
      - run:
          name: Materialize tree
          command: git clone --depth 2 -q --no-single-branch --no-tags https://github.com/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME .
      - run:
          name: Prepare source archive
          command: tar --extract --gzip --file=release-blobs-final.tgz
      - run:
          name: Hash artifacts
          no_output_timeout: 15m
          command: sleep 120
      - run:
          name: Package artifacts
          command: df -h
      - run:
          command: /bin/bash -c "./sleep-proc"
